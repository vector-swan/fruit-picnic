<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // The game moved to fruitpicnic.io: send visitors of the old github.io address there
    if (/\.github\.io$/.test(location.hostname)) location.replace('https://fruitpicnic.io/' + location.search + location.hash);
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Fruit Picnic</title>
  <meta name="apple-mobile-web-app-title" content="Fruit Picnic">
  <meta name="theme-color" content="#FFF8EC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <div class="title-block">
          <h1>Fruit Picnic</h1>
          <p class="subtitle">a cozy merge puzzle</p>
        </div>
        <div class="scores">
          <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-value" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-value" id="best">0</div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="newGameBtn">✿ New game</button>
        <button class="btn btn-icon" id="boardBtn" type="button" title="Leaderboard" aria-label="Leaderboard" hidden></button>
        <button class="btn btn-icon" id="settingsBtn" type="button" title="Settings" aria-label="Settings"></button>
      </div>
    </header>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="grid-bg">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
    </div>

    <p class="hint">Swipe to play · <button class="hint-link" id="howtoBtn" type="button">How to play</button></p>
  </div>

  <!-- Celebration overlay -->
  <div class="celebration" id="celebration">
    <div class="celebration-content">
      <img class="big-emoji basket-art" id="winArt" alt="A picnic basket full of fruit">
      <h2>Sweet victory!</h2>
      <p class="win-line">You made a watermelon!</p>
      <div class="final-stats">
        <div class="stat">
          <img class="stat-icon" data-stat="tile-art" alt="">
          <div><div class="stat-label">Top tile</div><div class="stat-value" data-stat="tile"></div></div>
        </div>
        <div class="stat">
          <span class="stat-icon stat-star" aria-hidden="true">★</span>
          <div><div class="stat-label">Score</div><div class="stat-value" data-stat="score">0</div></div>
        </div>
      </div>
      <div class="lb-post" hidden></div>
      <div class="btn-row">
        <button class="btn btn-big" id="keepGoingBtn">Keep going!</button>
        <button class="btn btn-big btn-secondary" id="celebNewGameBtn">New game</button>
      </div>
    </div>
    <canvas id="confetti"></canvas>
  </div>

  <!-- Game Over overlay -->
  <div class="gameover" id="gameover">
    <div class="gameover-content">
      <img class="big-emoji basket-art" id="gameoverArt" alt="An empty picnic basket">
      <h2>Picnic’s over!</h2>
      <p>No more moves left.</p>
      <div class="final-stats">
        <div class="stat">
          <img class="stat-icon" data-stat="tile-art" alt="">
          <div><div class="stat-label">Top tile</div><div class="stat-value" data-stat="tile"></div></div>
        </div>
        <div class="stat">
          <span class="stat-icon stat-star" aria-hidden="true">★</span>
          <div><div class="stat-label">Score</div><div class="stat-value" data-stat="score">0</div></div>
        </div>
      </div>
      <div class="lb-post" hidden></div>
      <button class="btn btn-big" id="gameoverNewGameBtn">Try again!</button>
    </div>
  </div>

  <!-- How to play -->
  <div class="howto" id="howto">
    <div class="howto-content">
      <h2>How to play</h2>
      <div class="steps" id="howtoSteps"></div>
      <button class="btn btn-big" id="howtoClose" type="button">Let’s play!</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings" id="settings">
    <div class="settings-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <div class="set-rows">
        <button class="set-row" id="soundToggle" type="button" role="switch" aria-checked="true">
          <span class="set-ico" id="soundIco" aria-hidden="true"></span><span class="set-label">Sound</span><span class="switch" aria-hidden="true"></span>
        </button>
        <button class="set-row" id="hapticsToggle" type="button" role="switch" aria-checked="true" hidden>
          <span class="set-ico" id="hapticsIco" aria-hidden="true"></span><span class="set-label">Vibration</span><span class="switch" aria-hidden="true"></span>
        </button>
      </div>
      <div class="set-heading">Theme</div>
      <div class="theme-pick" id="themePick"></div>
      <button class="btn btn-big" id="settingsClose" type="button">Done</button>
      <a class="lb-link privacy-link set-privacy" href="privacy.html" target="_blank" rel="noopener">Privacy policy</a>
    </div>
  </div>

  <!-- Friends leaderboard -->
  <div class="leaderboard" id="leaderboard">
    <div class="leaderboard-content" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <h2 id="lbTitle">🏆 Leaderboard</h2>
      <!-- filled in by leaderboard.js: the boards, your groups, and the steps for starting or joining one -->
      <div class="lb-view" id="lbView"></div>
      <p class="lb-note lb-flash" id="lbFlash" role="status" hidden></p>
      <p class="lb-note" id="lbFoot" hidden>Playing as <b id="lbMeName"></b> · <button class="lb-link" id="lbMeBtn" type="button">change name</button></p>
      <button class="btn btn-big btn-quiet lb-wide" id="lbClose" type="button">Back to the game</button>
    </div>
  </div>

  <script src="tiles.js"></script>
  <script src="game.js"></script>
  <script src="tutorial.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
